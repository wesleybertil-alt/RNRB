<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Offline - Claude E-Ink Notebook</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: 'Georgia', serif;
      font-size: 18px;
      line-height: 1.6;
      background-color: #FFFFFF;
      color: #000000;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem;
      text-align: center;
    }
    .container {
      max-width: 400px;
      border: 2px solid #000000;
      padding: 2rem;
    }
    h1 {
      font-size: 1.5rem;
      margin-bottom: 1rem;
      font-weight: 600;
    }
    p {
      margin-bottom: 1rem;
      color: #333333;
    }
    .icon {
      font-size: 3rem;
      margin-bottom: 1rem;
    }
    button {
      background: #000000;
      color: #FFFFFF;
      border: 2px solid #000000;
      padding: 0.75rem 1.5rem;
      font-size: 1rem;
      font-family: inherit;
      cursor: pointer;
      min-height: 48px;
    }
    .note {
      font-size: 0.875rem;
      color: #666666;
      margin-top: 1rem;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="icon">◎</div>
    <h1>You're Offline</h1>
    <p>The app is working offline. Your conversations and documents are saved locally.</p>
    <p>Claude requires an internet connection to respond to new messages.</p>
    <button onclick="window.location.reload()">Try Again</button>
    <p class="note">Your data is safe and will sync when you're back online.</p>
  </div>
</body>
</html>
